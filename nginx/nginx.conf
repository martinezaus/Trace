server {
    listen 80;
    server_name conetia.sistemas.com;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 20M;

    # Reescritura global: le saca el /trace al URI interno antes de buscar el archivo
    rewrite ^/trace$ / break;
    rewrite ^/trace/(.*)$ /$1 break;

    # Reescritura de rutas absolutas en el HTML de salida
    sub_filter 'href="/' 'href="/trace/';
    sub_filter 'src="/'  'src="/trace/';
    sub_filter_once off;
    sub_filter_types text/html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(env|git) {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}